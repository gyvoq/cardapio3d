<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza em AR</title>
<style>
:root{--bg:#1b1410;--panel:rgba(27,20,16,.82);--text:#fff6ea;--muted:#d8c3a8;--accent:#e8532b;--chip:#3a2b21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas.xr{position:fixed;inset:0;z-index:0}
#start{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle,#3a2418,#150e0a);overflow:auto}
#start h1{margin:0;font-size:28px}
#start p{margin:0;max-width:36ch;color:var(--muted);line-height:1.45}
#pick{width:100%;max-width:420px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:var(--accent);color:#fff}
.btn[disabled]{opacity:.4}
#msg{font-size:14px;color:#ffb4a0;max-width:36ch;line-height:1.4}
#ar{display:none;position:fixed;inset:0;z-index:2;pointer-events:none;color:var(--text)}
#ar>*{pointer-events:auto}
#hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;text-align:center;background:var(--panel);padding:10px 14px;border-radius:14px;font-size:14px}
#exit{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:12px;border:0;border-radius:999px;padding:8px 14px;background:var(--panel);color:var(--text)}
#hud{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;background:var(--chip);color:var(--text);font-size:14px}
.chip.on{background:var(--accent)}
.info{font-size:14px;color:var(--muted);margin:6px 2px 0}
</style>
</head>
<body>
<div id="start">
  <div style="font-size:56px">🍕</div>
  <h1>Pizza em AR</h1>
  <p>Escolha a pizza e coloque ela em tamanho real na sua mesa, usando a câmera do celular.</p>
  <div id="pick">
    <div class="row" id="types0"></div>
    <div class="row" id="sizes0"></div>
    <div class="info" id="info0"></div>
  </div>
  <button class="btn" id="go" disabled>Ver na minha mesa</button>
  <div id="msg">Verificando suporte a AR…</div>
</div>

<div id="ar">
  <div id="hint">Aponte para a mesa e toque para colocar a pizza</div>
  <button id="exit">✕ Sair</button>
  <div id="hud">
    <div class="row" id="types"></div>
    <div class="row" id="sizes"></div>
    <div class="info" id="info"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TYPES=[
 {id:'margherita',n:'Margherita',d:'Molho, muçarela, tomate e manjericão'},
 {id:'calabresa',n:'Calabresa',d:'Calabresa fatiada e cebola'},
 {id:'portuguesa',n:'Portuguesa',d:'Presunto, ovo, azeitona e cebola'},
 {id:'queijos',n:'Quatro queijos',d:'Muçarela, provolone, gorgonzola e parmesão'}
];
const SIZES=[{n:'Broto',d:25},{n:'Média',d:30},{n:'Grande',d:35},{n:'Gigante',d:40}];
let type=TYPES[0],size=SIZES[2],mode=null;
const $=id=>document.getElementById(id);

/* ---------- textura da pizza ---------- */
const cvCache={},texCache={};
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function canvasFor(t){
  if(cvCache[t.id])return cvCache[t.id];
  const c=document.createElement('canvas');c.width=c.height=512;
  const g=c.getContext('2d');g.translate(256,256);g.scale(5.12,5.12);
  const r=rng(t.id.length*977+13);
  const circ=(x,y,rad,f)=>{g.beginPath();g.arc(x,y,rad,0,6.2832);g.fillStyle=f;g.fill()};
  const ell=(x,y,rx,ry,f)=>{g.beginPath();g.ellipse(x,y,rx,ry,r()*3.14,0,6.2832);g.fillStyle=f;g.fill()};
  const ring=(x,y,rad,col)=>{g.beginPath();g.arc(x,y,rad,0,6.2832);g.strokeStyle=col;g.lineWidth=1.2;g.stroke()};
  const rep=(n,f)=>{for(let i=0;i<n;i++){const a=r()*6.2832,d=Math.sqrt(r())*37;f(Math.cos(a)*d,Math.sin(a)*d,i)}};
  g.fillStyle='#d9923f';g.fillRect(-50,-50,100,100);
  circ(0,0,50,'#d9923f');
  circ(0,0,43,t.id==='margherita'?'#e0442a':'#f1bf4c');
  if(t.id==='margherita'){
    rep(14,(x,y)=>ell(x,y,6+r()*4,5+r()*3,'#fff3d6'));
    rep(8,(x,y)=>ell(x,y,4,2,'#2f8a3b'));
  }else if(t.id==='calabresa'){
    rep(26,(x,y)=>{circ(x,y,4.2,'#b3322a');circ(x+1,y-1,1,'#7a1d18')});
    rep(12,(x,y)=>ring(x,y,4,'#f4ecff'));
  }else if(t.id==='portuguesa'){
    rep(12,(x,y)=>ell(x,y,4,3,'#f0a0a0'));
    rep(10,(x,y)=>ring(x,y,4,'#e6d2f5'));
    rep(4,(x,y)=>{circ(x,y,6,'#fff');circ(x,y,2.6,'#f5b81c')});
    rep(12,(x,y)=>{circ(x,y,2.4,'#2a2330');circ(x,y,.9,'#f1bf4c')});
  }else{
    const col=['#fff3c8','#f6dc8c','#c9d6e8','#f3e6c0'];
    rep(22,(x,y,i)=>ell(x,y,5+r()*4,4+r()*3,col[i%4]));
    rep(8,(x,y)=>circ(x,y,1.8,'#6d8fb8'));
  }
  g.strokeStyle='rgba(59,35,18,.45)';g.lineWidth=.6;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*50,Math.sin(a)*50);g.stroke()}
  return cvCache[t.id]=c;
}
function texFor(t){return texCache[t.id]||(texCache[t.id]=new THREE.CanvasTexture(canvasFor(t)))}

/* ---------- iPhone: gera USDZ e abre o AR Quick Look ---------- */
function crc32(u){let crc=0xFFFFFFFF,c;for(let i=0;i<u.length;i++){c=(crc^u[i])&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return(crc^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),n=f.data.length;
    let pad=(64-(off+30+nm.length)%64)%64;if(pad&&pad<4)pad+=64; // dados alinhados em 64 bytes (exigido pelo USDZ)
    const hb=new Uint8Array(30+nm.length+pad),h=new DataView(hb.buffer);
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,n,true);h.setUint32(22,n,true);
    h.setUint16(26,nm.length,true);h.setUint16(28,pad,true);
    hb.set(nm,30);
    if(pad){h.setUint16(30+nm.length,0xFFFF,true);h.setUint16(32+nm.length,pad-4,true)}
    parts.push(hb,f.data);cd.push({nm,crc,n,off});off+=hb.length+n;
  }
  const cdStart=off;
  for(const e of cd){
    const b=new Uint8Array(46+e.nm.length),h=new DataView(b.buffer);
    h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(14,0x21,true);
    h.setUint32(16,e.crc,true);h.setUint32(20,e.n,true);h.setUint32(24,e.n,true);
    h.setUint16(28,e.nm.length,true);h.setUint32(42,e.off,true);b.set(e.nm,46);
    parts.push(b);off+=b.length;
  }
  const end=new Uint8Array(22),eh=new DataView(end.buffer);
  eh.setUint32(0,0x06054b50,true);eh.setUint16(8,cd.length,true);eh.setUint16(10,cd.length,true);
  eh.setUint32(12,off-cdStart,true);eh.setUint32(16,cdStart,true);parts.push(end);
  const out=new Uint8Array(parts.reduce((s,p)=>s+p.length,0));let o=0;
  for(const p of parts){out.set(p,o);o+=p.length}
  return out;
}
function usda(R,H,S=64){
  const P=a=>'['+a.map(v=>'('+v.map(n=>+n.toFixed(5)).join(', ')+')').join(', ')+']';
  const I=a=>'['+a.join(', ')+']';
  const ang=i=>i/S*Math.PI*2;
  // topo
  const tp=[[0,H,0]],tn=[[0,1,0]],tuv=[[.5,.5]],ti=[];
  for(let i=0;i<=S;i++){const a=ang(i);tp.push([Math.cos(a)*R,H,-Math.sin(a)*R]);tn.push([0,1,0]);tuv.push([.5+Math.cos(a)/2,.5+Math.sin(a)/2])}
  for(let i=0;i<S;i++)ti.push(0,i+1,i+2);
  // lateral + fundo
  const bp=[],bn=[],bi=[];
  for(let i=0;i<=S;i++){const a=ang(i),c=Math.cos(a),s=-Math.sin(a);bp.push([c*R,H,s*R]);bn.push([c,0,s])}
  for(let i=0;i<=S;i++){const a=ang(i),c=Math.cos(a),s=-Math.sin(a);bp.push([c*R,0,s*R]);bn.push([c,0,s])}
  for(let i=0;i<S;i++)bi.push(i,S+1+i,S+2+i,i,S+2+i,i+1);
  const cIdx=bp.length;bp.push([0,0,0]);bn.push([0,-1,0]);
  for(let i=0;i<=S;i++){const a=ang(i);bp.push([Math.cos(a)*R,0,-Math.sin(a)*R]);bn.push([0,-1,0])}
  for(let i=0;i<S;i++)bi.push(cIdx,cIdx+2+i,cIdx+1+i);
  const mesh=(name,cnt,idx,pts,nrm,uv,mat)=>`
  def Mesh "${name}"
  {
    int[] faceVertexCounts = ${I(Array(cnt).fill(3))}
    int[] faceVertexIndices = ${I(idx)}
    point3f[] points = ${P(pts)}
    normal3f[] normals = ${P(nrm)} (
      interpolation = "vertex"
    )${uv?`
    texCoord2f[] primvars:st = ${P(uv)} (
      interpolation = "vertex"
    )`:''}
    uniform token subdivisionScheme = "none"
    uniform bool doubleSided = true
    rel material:binding = </Pizza/Materials/${mat}>
  }`;
  const m='/Pizza/Materials/';
  return `#usda 1.0
(
  defaultPrim = "Pizza"
  metersPerUnit = 1
  upAxis = "Y"
)
def Xform "Pizza"
{${mesh('Top',S,ti,tp,tn,tuv,'TopMat')}${mesh('Body',bi.length/3,bi,bp,bn,null,'BodyMat')}
  def Scope "Materials"
  {
    def Material "TopMat"
    {
      token outputs:surface.connect = <${m}TopMat/Surf.outputs:surface>
      def Shader "Surf"
      {
        uniform token info:id = "UsdPreviewSurface"
        color3f inputs:diffuseColor.connect = <${m}TopMat/Tex.outputs:rgb>
        float inputs:roughness = 0.8
        float inputs:metallic = 0
        token outputs:surface
      }
      def Shader "ST"
      {
        uniform token info:id = "UsdPrimvarReader_float2"
        token inputs:varname = "st"
        float2 inputs:fallback = (0, 0)
        float2 outputs:result
      }
      def Shader "Tex"
      {
        uniform token info:id = "UsdUVTexture"
        asset inputs:file = @tex.png@
        float2 inputs:st.connect = <${m}TopMat/ST.outputs:result>
        token inputs:wrapS = "clamp"
        token inputs:wrapT = "clamp"
        float3 outputs:rgb
      }
    }
    def Material "BodyMat"
    {
      token outputs:surface.connect = <${m}BodyMat/Surf.outputs:surface>
      def Shader "Surf"
      {
        uniform token info:id = "UsdPreviewSurface"
        color3f inputs:diffuseColor = (0.82, 0.52, 0.2)
        float inputs:roughness = 0.9
        token outputs:surface
      }
    }
  }
}
`;
}
async function openQuickLook(){
  const b=$('go'),old=b.textContent;b.disabled=true;b.textContent='Preparando a pizza…';
  try{
    const blob=await new Promise(r=>canvasFor(type).toBlob(r,'image/png'));
    const png=new Uint8Array(await blob.arrayBuffer());
    const d=size.d/100; // diâmetro real em metros
    const zip=makeZip([{name:'pizza.usda',data:new TextEncoder().encode(usda(d/2,0.02))},{name:'tex.png',data:png}]);
    const url=URL.createObjectURL(new Blob([zip],{type:'model/vnd.usdz+zip'}))+'#allowsContentScaling=0';
    const a=document.createElement('a');a.rel='ar';a.href=url;a.appendChild(document.createElement('img'));a.click();
  }catch(e){$('msg').textContent='Não consegui preparar o AR. Abra este link direto no Safari.'}
  b.disabled=false;b.textContent=old;
}

/* ---------- Android: cena WebXR ---------- */
let renderer,scene,camera,pizza,topMat,reticle,hitSource=null,refSpace=null,session=null;
function init(){
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;renderer.domElement.className='xr';document.body.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,20);
  scene.add(new THREE.HemisphereLight(0xffffff,0x887766,1.1));
  const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(1,3,1);scene.add(dl);
  pizza=new THREE.Group();const H=.04;
  topMat=new THREE.MeshStandardMaterial({map:texFor(type),roughness:.8});
  const side=new THREE.MeshStandardMaterial({color:0xd9923f,roughness:.9}),bot=new THREE.MeshStandardMaterial({color:0xb9762c});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,H,64),[side,topMat,bot]);
  body.position.y=H/2;pizza.add(body);
  const sc=document.createElement('canvas');sc.width=sc.height=128;
  const sg=sc.getContext('2d'),gr=sg.createRadialGradient(64,64,30,64,64,64);
  gr.addColorStop(0,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,128,128);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;sh.position.y=.002;pizza.add(sh);
  pizza.visible=false;scene.add(pizza);
  reticle=new THREE.Mesh(new THREE.RingGeometry(.12,.15,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));
  reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
  apply();
}
function apply(){
  const t=`${type.n} · Ø ${size.d} cm — ${type.d}`;
  $('info').textContent=t;$('info0').textContent=t;
  if(!pizza)return;
  topMat.map=texFor(type);topMat.needsUpdate=true;pizza.scale.setScalar(size.d/100);
}

/* ---------- UI ---------- */
function chips(id,list,cur,on,lab){
  const box=$(id);box.innerHTML='';
  list.forEach(i=>{const b=document.createElement('button');b.className='chip'+(i===cur()?' on':'');
    b.textContent=lab(i);b.onclick=()=>{on(i);renderChips();apply()};box.appendChild(b)});
}
function renderChips(){
  for(const s of ['','0']){
    chips('types'+s,TYPES,()=>type,t=>type=t,i=>i.n);
    chips('sizes'+s,SIZES,()=>size,s2=>size=s2,i=>`${i.n} ${i.d} cm`);
  }
}
renderChips();apply();
$('ar').addEventListener('beforexrselect',e=>e.preventDefault());

async function startXR(){
  try{
    if(!renderer)init();
    $('ar').style.display='block';
    session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay','local-floor'],domOverlay:{root:$('ar')}});
  }catch(e){
    $('ar').style.display='none';
    $('msg').textContent='Não foi possível iniciar o AR. Abra este link no Chrome do Android, direto no navegador.';return;
  }
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  refSpace=renderer.xr.getReferenceSpace();
  const viewer=await session.requestReferenceSpace('viewer');
  hitSource=await session.requestHitTestSource({space:viewer});
  $('start').style.display='none';
  session.addEventListener('select',()=>{
    if(!reticle.visible)return;
    pizza.position.setFromMatrixPosition(reticle.matrix);pizza.visible=true;
    $('hint').textContent='Toque em outro ponto para mover. Ande em volta: ela fica fixa na mesa.';
  });
  session.addEventListener('end',()=>{
    hitSource=null;session=null;pizza.visible=false;renderer.setAnimationLoop(null);
    $('ar').style.display='none';$('start').style.display='flex';
    $('hint').textContent='Aponte para a mesa e toque para colocar a pizza';
  });
  renderer.setAnimationLoop((t,frame)=>{
    if(frame&&hitSource){
      const hits=frame.getHitTestResults(hitSource);
      if(hits.length){const p=hits[0].getPose(refSpace);reticle.visible=true;reticle.matrix.fromArray(p.transform.matrix)}
      else reticle.visible=false;
    }
    renderer.render(scene,camera);
  });
}
$('exit').onclick=()=>session&&session.end();
$('go').onclick=()=>mode==='ios'?openQuickLook():startXR();

(async()=>{
  const m=$('msg');
  let ql=false;
  try{ql=document.createElement('a').relList.supports('ar')}catch(e){}
  if(ql){mode='ios';m.style.color='var(--muted)';m.textContent='Dica: abra no Safari. A pizza abre em tamanho real; mova com o dedo e gire com dois dedos.';$('go').disabled=false;return}
  if(!navigator.xr){m.textContent='Este navegador não suporta AR. No iPhone use o Safari; no Android use o Chrome.';return}
  try{
    if(await navigator.xr.isSessionSupported('immersive-ar')){mode='xr';m.textContent='';$('go').disabled=false}
    else m.textContent='Este aparelho não suporta AR na web. Use o Chrome em um Android com ARCore ou o Safari no iPhone.';
  }catch(e){m.textContent='Não consegui verificar o suporte a AR neste navegador.'}
})();
</script>
</body>
</html>
